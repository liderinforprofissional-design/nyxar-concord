name = "nyxar-signal"
main = "worker.js"
compatibility_date = "2024-09-23"

# Durable Object para as salas de sinalização
[[durable_objects.bindings]]
name = "SIGNAL"
class_name = "SignalRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SignalRoom"]

[vars]
# Token ID da sua TURN Key (não é segredo — é só o identificador)
TURN_KEY_ID = "832d58ceef40edbd74566f6078ad2314"
# O SECRET (API Token) NÃO vai aqui. Ele é definido com:
#   wrangler secret put TURN_API_TOKEN
